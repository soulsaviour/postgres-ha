---
- name: Run etcd for Patroni's leader election
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Install PostgreSQL and Patroni
  hosts: postgres
  become: true
  roles:
    - postgresql
    - patroni
    - pgbouncer

- name: Route clients to the right node
  hosts: haproxy
  become: true
  roles:
    - haproxy
