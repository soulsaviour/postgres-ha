---
# Address the cluster members use to reach each other.
node_ip: "{{ ansible_host }}"

# PostgreSQL major version, from the PGDG repository.
postgresql_version: 17

patroni_cluster_name: pg-main

# Network that may connect to PostgreSQL and PgBouncer.
cluster_cidr: 10.0.1.0/24

# PgBouncer listens here on every database node; HAProxy forwards to it.
pgbouncer_port: 6432
