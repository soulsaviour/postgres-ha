---
- name: Add the PostgreSQL (PGDG) apt repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc

- name: Install postgresql-common
  ansible.builtin.apt:
    name: postgresql-common
    update_cache: true

# Patroni creates and owns the data directory, so stop the Debian packaging
# from creating a "main" cluster of its own.
- name: Don't create a default cluster on install
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^#?\s*create_main_cluster\s*='
    line: create_main_cluster = false

- name: Install PostgreSQL {{ postgresql_version }}
  ansible.builtin.apt:
    name: "postgresql-{{ postgresql_version }}"

- name: Leave PostgreSQL to Patroni
  ansible.builtin.systemd_service:
    name: postgresql
    enabled: false
    state: stopped
