---
- name: Create the etcd user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/etcd
    state: directory
    mode: "0755"

- name: Check the installed version
  ansible.builtin.command: /usr/local/bin/etcd --version
  register: etcd_installed
  changed_when: false
  failed_when: false

- name: Install etcd {{ etcd_version }}
  when: '("etcd Version: " ~ etcd_version) not in (etcd_installed.stdout | default(""))'
  block:
    - name: Download the release
      ansible.builtin.unarchive:
        src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install the binaries
      ansible.builtin.copy:
        src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: [etcd, etcdctl, etcdutl]
      notify: Restart etcd

- name: Write the config
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: /etc/etcd/etcd.conf.yml
    mode: "0644"
  notify: Restart etcd

- name: Install the systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: Restart etcd

# All members must start together for the initial cluster to form.
- name: Start etcd
  ansible.builtin.systemd_service:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true

- name: Wait until every member is healthy
  ansible.builtin.command: etcdctl endpoint health --cluster
  environment:
    ETCDCTL_ENDPOINTS: "http://{{ node_ip }}:2379"
  register: etcd_health
  until: etcd_health.rc == 0
  retries: 12
  delay: 5
  changed_when: false
